<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صلاحية غير متوفرة</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f3f4f6; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { 
            text-align: center; 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            max-width: 450px; 
            width: 90%;
        }
        .icon { font-size: 60px; margin-bottom: 15px; }
        h1 { color: #dc2626; font-size: 26px; margin-bottom: 10px; }
        p { color: #4b5563; font-size: 16px; margin-bottom: 25px; line-height: 1.6; }
        a { 
            display: inline-block; 
            padding: 12px 25px; 
            background-color: #111827; 
            color: white; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: bold;
            transition: background 0.3s; 
        }
        a:hover { background-color: #374151; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚫</div>
        <h1>عفواً، الدخول مرفوض!</h1>
        <p>الصفحة التي تحاول الوصول إليها تتطلب صلاحيات غير متوفرة في حسابك الحالي. يرجى التواصل مع الإدارة أو مدير النظام إذا كنت تعتقد أن هذا خطأ.</p>
        <a href="/admin/">العودة للوحة التحكم</a>
    </div>
</body>
</html>
