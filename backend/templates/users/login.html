{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr"> <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUILD&TRUST | Secure Login</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <style>
        :root {
            /* ألوان الهوية البصرية */
            --bg-deep: #050b14;      /* كحلي شديد السواد */
            --bg-panel: #0f172a;     /* كحلي مريح */
            --primary: #00e5ff;      /* السماوي المشع (هويتك) */
            --primary-dim: rgba(0, 229, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', 'Cairo', sans-serif; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* --- 1. الخلفية الشبكية (The Tech Grid) --- */
        .grid-bg {
            position: absolute;
            width: 200%; height: 200%;
            background-image: 
                linear-gradient(var(--border-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--border-color) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.15;
            transform: perspective(500px) rotateX(60deg);
            animation: gridMove 20s linear infinite;
            z-index: 0;
            top: -50%;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(40px); }
        }

        /* --- 2. الكارت الرئيسي (Desktop) --- */
        .login-card {
            width: 1000px;
            height: 600px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            display: flex;
            position: relative;
            z-index: 10;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        /* خط ليزر علوي جمالي */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            opacity: 0.8;
        }

        /* --- القسم الأيسر (الفورم) --- */
        .form-side {
            flex: 1;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .brand-logo {
            font-size: 20px; font-weight: 700;
            color: var(--primary); letter-spacing: 2px;
            margin-bottom: 40px; display: flex; align-items: center; gap: 8px;
        }

        .form-header h2 { font-size: 28px; margin-bottom: 5px; }
        .form-header p { color: var(--text-muted); font-size: 14px; margin-bottom: 30px; }

        /* Inputs */
        .input-group { position: relative; margin-bottom: 20px; }
        
        .input-group input {
            width: 100%;
            padding: 16px 20px 16px 45px; /* مساحة للأيقونة على اليسار */
            background: var(--bg-deep);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }
        
        .input-group i {
            position: absolute; left: 16px; top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted); font-size: 20px; transition: 0.3s;
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-dim);
        }
        .input-group input:focus + i { color: var(--primary); }

        /* Button */
        .btn-login {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: #050b14;
            font-weight: 700;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
        }

        .btn-login:hover {
            background: #fff;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.4);
            transform: translateY(-2px);
        }

        /* --- القسم الأيمن (الصورة والبراند) --- */
        .visual-side {
            flex: 1.2;
            background: linear-gradient(135deg, rgba(0, 229, 255, 0.05), transparent);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-left: 1px solid var(--border-color); /* تعديل ليكون الحد على اليسار ليفصل بينه وبين الفورم */
            overflow: hidden;
        }

        .visual-content { z-index: 2; text-align: center; padding: 40px; }
        
        .visual-content h1 {
            font-size: 42px; font-weight: 800;
            letter-spacing: -1px; margin-bottom: 15px;
            color: #fff;
        }
        .highlight { color: var(--primary); }
        .visual-content p { color: var(--text-muted); font-size: 16px; line-height: 1.6; max-width: 350px; }

        /* دائرة الديكور */
        .tech-circle {
            position: absolute;
            width: 400px; height: 400px;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            animation: spin 30s linear infinite;
        }
        .tech-circle::after {
            content: ''; position: absolute;
            width: 350px; height: 350px;
            border: 1px dashed var(--primary);
            opacity: 0.2; border-radius: 50%;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* --- MOBILE DESIGN (The Clean Fix) --- */
        @media (max-width: 960px) {
            body { 
                align-items: flex-start; 
                overflow-y: auto; /* السماح بالسكرول إذا فتحت الكيبورد */
            }
            
            .grid-bg { opacity: 0.1; }

            .login-card {
                width: 100%; min-height: 100vh;
                border: none; border-radius: 0;
                background: transparent;
                flex-direction: column;
                box-shadow: none;
            }

            .login-card::before { display: none; }
            .visual-side { display: none; }

            .form-side {
                padding: 30px;
                justify-content: center;
                min-height: 100vh; /* تعديل لمنع كسر الشاشة مع الكيبورد */
                background: linear-gradient(180deg, rgba(5,11,20,0) 0%, rgba(5,11,20,1) 100%);
            }

            .brand-logo {
                justify-content: center;
                font-size: 28px;
                margin-bottom: 50px;
                text-shadow: 0 0 20px var(--primary-dim);
            }

            .form-header { text-align: center; }
            
            .input-group input {
                background: rgba(255,255,255,0.03);
                padding: 18px 20px 18px 50px;
                font-size: 16px;
            }

            .btn-login {
                margin-top: 20px;
                padding: 18px;
            }
        }

        /* Auto-fill fix */
        input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 30px var(--bg-deep) inset !important;
            -webkit-text-fill-color: white !important;
        }
    </style>
</head>
<body>

    <div class="grid-bg"></div>

    <div class="login-card">
        
        <div class="form-side">
            <div class="brand-logo">
                <i class='bx bxs-layer'></i> BUILD&TRUST
            </div>

            <div class="form-header">
                <h2>Welcome Back</h2>
                <p>Please log in to continue to your dashboard.</p>
            </div>

            <form method="POST" action="{% url 'users:login' %}">
                {% csrf_token %}

                {% if form.errors %}
                <div style="background: rgba(255, 77, 77, 0.1); color: #ff6b6b; padding: 12px; border-radius: 6px; font-size: 13px; margin-bottom: 20px; text-align: center; border: 1px solid rgba(255, 77, 77, 0.2);">
                    Invalid credentials. Please try again.
                </div>
                {% endif %}

                <div class="input-group">
                    <input type="email" name="username" placeholder="Email Address" required>
                    <i class='bx bx-envelope'></i>
                </div>

                <div class="input-group">
                    <input type="password" name="password" placeholder="Password" required>
                    <i class='bx bx-lock-alt'></i>
                </div>

                <div style="display: flex; justify-content: space-between; margin-bottom: 30px; font-size: 13px; color: var(--text-muted);">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" style="accent-color: var(--primary);"> Remember me
                    </label>
                    <a href="#" style="color: var(--primary); text-decoration: none;">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-login">
                    Login Access
                </button>
            </form>
        </div>

        <div class="visual-side">
            <div class="tech-circle"></div>
            <div class="visual-content">
                <h1>BUILD <span class="highlight">&</span> TRUST</h1>
                <p>Enterprise Resource Planning</p>
                <div style="margin-top: 30px; display: flex; gap: 10px; justify-content: center;">
                    <span style="width: 8px; height: 8px; background: var(--primary); border-radius: 50%;"></span>
                    <span style="width: 8px; height: 8px; background: rgba(255,255,255,0.2); border-radius: 50%;"></span>
                    <span style="width: 8px; height: 8px; background: rgba(255,255,255,0.2); border-radius: 50%;"></span>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
